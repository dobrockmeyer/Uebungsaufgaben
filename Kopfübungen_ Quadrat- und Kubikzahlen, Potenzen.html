<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopfübungen: Quadrat- und Kubikzahlen, Potenzen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f9fc;--grid:#d9e3f1;--ink:#1d2b4a;--muted:#55658a;--accent:#1f5fd1;--accent-ink:#fff;--card:#fff;--ok:#1b7447;--okbg:#e3f4ea;--bad:#b8322a;--badbg:#fbe6e3;--line:#b9c8e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111a2c;--grid:#1d2a44;--ink:#e6ecf8;--muted:#9aa9c6;--accent:#7aa7ff;--accent-ink:#0d1730;--card:#18233a;--ok:#74d6a0;--okbg:#17372a;--bad:#ff8f84;--badbg:#40201e;--line:#34456a}}
:root[data-theme="dark"]{--paper:#111a2c;--grid:#1d2a44;--ink:#e6ecf8;--muted:#9aa9c6;--accent:#7aa7ff;--accent-ink:#0d1730;--card:#18233a;--ok:#74d6a0;--okbg:#17372a;--bad:#ff8f84;--badbg:#40201e;--line:#34456a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;line-height:1.2;margin:8px 0 8px}
.lead{color:var(--muted);margin:0 0 20px;font-size:1rem}
.cats{display:grid;gap:10px}
@media(min-width:520px){.cats{grid-template-columns:1fr 1fr}}
.cat{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
.cat:hover{border-color:var(--accent)}
.cat:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cat b{display:block;font-size:1.05rem}
.cat span{display:block;font-size:.9rem;color:var(--muted)}
.cat .best{margin-top:4px;color:var(--ink)}
details{margin-top:20px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
.tab{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 4px;font-size:.95rem}
.tab h3{width:100%;font-size:1rem;margin:8px 0 0}
.tab i{font-style:normal;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.link{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;font-size:1rem}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:20px 16px}
.catname{color:var(--muted);font-size:.95rem;margin:0 0 6px}
.q{font-size:2.6rem;line-height:1.3;text-align:center;margin:14px 0 18px;min-height:3.4rem}
.q sup{font-size:.6em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.7em;line-height:1.15;margin:0 2px}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
input{width:100%;font:inherit;font-size:1.6rem;text-align:center;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
input:disabled{opacity:.8}
.hlp{display:flex;gap:8px;justify-content:center;margin-top:10px}.hlp button{font:inherit;font-size:1.1rem;padding:6px 16px;border:2px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent);cursor:pointer}
.err{color:var(--bad);font-size:.95rem;min-height:1.4rem;margin:6px 0 0}
.go{display:block;width:100%;margin-top:10px;font:inherit;font-weight:700;font-size:1.1rem;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.fb{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:1rem}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.score{font-size:2.4rem;font-weight:700;margin:4px 0}
ul{padding-left:20px}
li{margin:8px 0}
.two{display:grid;gap:10px;margin-top:16px}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
</style>
</head>
<body>
<main>
<section id="home">
<h1>Kopfübungen: Quadrat- und Kubikzahlen, Potenzen</h1>
<p class="lead">Wähle eine Kategorie. Eine Runde hat 10 Aufgaben, alle ohne Taschenrechner. Kommazahlen gibst du mit Komma ein, Brüche als 3/4.</p>
<div id="cats" class="cats"></div>
<details><summary>Zahlentafel zum Nachschlagen</summary><div id="tafel" class="tab"></div></details>
</section>

<section id="play" hidden>
<div class="top"><button class="link" id="back" type="button">Kategorien</button><span id="prog"></span></div>
<div class="bar"><div id="barin"></div></div>
<div class="card">
<p class="catname" id="catname"></p>
<div class="q" id="q" aria-live="polite"></div>
<label for="ans" class="catname">Deine Antwort</label>
<input id="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="hlp" id="hlp" hidden><button type="button" data-t="^">^ hoch</button><button type="button" data-t=" · ">· mal</button></div>
<p class="err" id="err" role="alert"></p>
<div class="fb" id="fb" role="status" hidden></div>
<button class="go" id="go" type="button">Prüfen</button>
</div>
</section>

<section id="end" hidden>
<div class="card">
<p class="catname" id="endcat"></p>
<div class="score" id="score"></div>
<p id="msg"></p>
<div id="wrong"></div>
<div class="two"><button class="go" id="again" type="button">Noch eine Runde</button><button class="go sec" id="other" type="button">Andere Kategorie</button></div>
</div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const sup=n=>'<sup>'+n+'</sup>';
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const fr=(n,d)=>'<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';
const fmt=x=>String(Math.round(x*1e6)/1e6).replace('.',',').replace('-','−');
const rep=(b,e)=>Array(e).fill(b<0?'('+fmt(b)+')':fmt(b)).join(' · ');
const C=[
{id:'sq',name:'Quadratzahlen',sub:'2² bis 20²',gen(){const n=R(2,20);return{q:n+sup(2),a:n*n,ex:n+' · '+n+' = '+n*n}}},
{id:'cube',name:'Kubikzahlen',sub:'2³ bis 10³',gen(){const n=R(2,10);return{q:n+sup(3),a:n**3,ex:n+' · '+n+' · '+n+' = '+n**3}}},
{id:'pow',name:'Potenzen berechnen',sub:'2⁵, 3⁴, 10⁶ …',gen(){const b=pick([2,2,2,3,3,4,5,10,10]);const e=b==2?R(2,9):b==3?R(2,5):b==10?R(2,6):R(2,4);return{q:b+sup(e),a:b**e,ex:rep(b,e)+' = '+b**e}}},
{id:'write',name:'Potenzen schreiben',sub:'5 · 5 · 5 · 5 als Potenz',gen(){let f;if(Math.random()<.4){f=[[pick([2,3,4,5,6,7,9,10]),R(3,6)]]}else{const bs=[2,3,4,5,6,7].sort(()=>Math.random()-.5).slice(0,R(2,3)).sort((x,y)=>x-y);f=bs.map(b=>[b,R(1,3)]);while(f.reduce((s,x)=>s+x[1],0)>7)f[R(0,f.length-1)][1]=1;if(f.every(x=>x[1]==1))f[0][1]=2}const list=[];f.forEach(([b,e])=>{for(let k=0;k<e;k++)list.push(b)});if(f.length>1&&Math.random()<.3)list.sort(()=>Math.random()-.5);const key={};f.forEach(([b,e])=>key[b]=e);const show=f.map(([b,e])=>e==1?b:b+sup(e)).join(' · ');return{text:true,q:list.join(' · ')+' = ?',key,show,ex:'Gleiche Faktoren fasst du zur Potenz zusammen: '+show}}},
{id:'dec',name:'Kommazahlen und Brüche',sub:'0,2³ und (2/3)²',gen(){if(Math.random()<.5){const[b,e]=pick([[.1,2],[.1,3],[.2,2],[.2,3],[.3,2],[.4,2],[.5,2],[.5,3],[1.1,2],[1.5,2],[1.5,3],[2.5,2]]);const a=Math.round(b**e*1e6)/1e6;return{q:fmt(b)+sup(e),a,ex:rep(b,e)+' = '+fmt(a)}}const[n,d,e]=pick([[1,2,2],[1,2,3],[1,3,2],[2,3,2],[3,4,2],[1,10,2],[1,10,3],[2,5,2],[3,5,2]]);const s=n**e+'/'+d**e;return{q:'('+fr(n,d)+')'+sup(e),a:(n/d)**e,show:s,ex:'Zähler und Nenner potenzieren: '+s}}},
{id:'mix',name:'Alles gemischt',sub:'bunte Mischung',gen(){return pick(C.slice(0,-1)).gen()}}
];
let cat,qs,i,score,wrong,checked;
function show(id){['home','play','end'].forEach(x=>$('#'+x).hidden=x!==id);window.scrollTo(0,0)}
function best(){try{return JSON.parse(localStorage.getItem('pot-best')||'{}')}catch(e){return{}}}
function saveBest(id,s){try{const b=best();if(!(b[id]>=s)){b[id]=s;localStorage.setItem('pot-best',JSON.stringify(b))}}catch(e){}}
function home(){const b=best();$('#cats').innerHTML=C.map(c=>'<button class="cat" type="button" data-id="'+c.id+'"><b>'+c.name+'</b><span>'+c.sub+'</span><span class="best">'+(b[c.id]!=null?'Bestes Ergebnis: '+b[c.id]+' von 10':'Noch nicht geübt')+'</span></button>').join('');show('home')}
function tafel(){let s='<h3>Quadratzahlen</h3>';for(let n=1;n<=20;n++)s+='<i>'+n+'² = '+n*n+'</i>';s+='<h3>Kubikzahlen</h3>';for(let n=1;n<=10;n++)s+='<i>'+n+'³ = '+n**3+'</i>';s+='<h3>Zehnerpotenzen</h3>';for(let n=1;n<=6;n++)s+='<i>10'+sup(n)+' = '+10**n+'</i>';$('#tafel').innerHTML=s}
function parse(s){s=s.trim().replace(/\s/g,'').replace(/−/g,'-').replace(/,/g,'.');if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const p=s.split('/');return +p[0]/+p[1]}if(/^-?\d+(\.\d+)?$/.test(s))return +s;return NaN}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parsePow(s){const sm={'⁰':0,'¹':1,'²':2,'³':3,'⁴':4,'⁵':5,'⁶':6,'⁷':7,'⁸':8,'⁹':9};s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+[...m].map(c=>sm[c]).join('')).replace(/[\s()]/g,'').replace(/[*×⋅∙]/g,'·');if(!s)return null;const m={};let dup=false;for(const f of s.split('·')){const r=/^(\d+)(?:\^(\d+))?$/.exec(f);if(!r)return null;const b=+r[1],e=r[2]==null?1:+r[2];if(m[b]!=null)dup=true;m[b]=(m[b]||0)+e}return{m,dup}}
function samePow(a,b){const ka=Object.keys(a),kb=Object.keys(b);return ka.length==kb.length&&ka.every(k=>a[k]===b[k])}
function start(id){cat=C.find(c=>c.id===id);qs=[];const seen=new Set();let t=0;while(qs.length<10&&t++<300){const g=cat.gen();if(!seen.has(g.q)){seen.add(g.q);qs.push(g)}}i=0;score=0;wrong=[];show('play');render()}
function render(){checked=false;$('#catname').textContent=cat.name;$('#prog').textContent='Aufgabe '+(i+1)+' von 10';$('#barin').style.width=(i/10*100)+'%';$('#q').innerHTML=qs[i].q;const a=$('#ans');a.value='';a.disabled=false;$('#hlp').hidden=!qs[i].text;$('#q').style.fontSize=qs[i].text?'1.8rem':'';$('#err').textContent='';$('#fb').hidden=true;$('#go').textContent='Prüfen';a.focus()}
function check(){const g=qs[i],a=$('#ans');let ok;if(g.text){const p=parsePow(a.value);if(!p){$('#err').textContent='Schreibe zum Beispiel 5^4 oder 2^2 · 3 · 7^2.';return}ok=!p.dup&&samePow(p.m,g.key)}else{const v=parse(a.value);if(isNaN(v)){$('#err').textContent='Gib erst eine Zahl ein, zum Beispiel 16, 0,25 oder 3/4.';return}ok=Math.abs(v-g.a)<1e-9*Math.max(1,Math.abs(g.a))}const right=g.show||fmt(g.a);const fb=$('#fb');fb.hidden=false;fb.className='fb '+(ok?'ok':'bad');if(ok){score++;fb.textContent='Richtig! '+g.ex}else{fb.innerHTML='Nicht ganz. Richtig ist '+right+'. '+g.ex;wrong.push({q:g.q,given:a.value.trim(),right:right,ex:g.ex})}a.disabled=true;checked=true;$('#go').textContent=i==9?'Ergebnis ansehen':'Weiter'}
function next(){if(i==9){finish();return}i++;render()}
function finish(){saveBest(cat.id,score);$('#endcat').textContent=cat.name;$('#score').textContent=score+' von 10';$('#msg').textContent=score==10?'Perfekt, alles richtig!':score>=8?'Sehr gut, fast alles sitzt.':score>=5?'Gut, an ein paar Stellen lohnt sich noch Übung.':'Übe diese Kategorie gern noch einmal, die Zahlentafel hilft dir dabei.';$('#wrong').innerHTML=wrong.length?'<p><b>Zum Nachschauen:</b></p><ul>'+wrong.map(w=>'<li>'+w.q+' = '+w.right+' (deine Antwort: '+esc(w.given||'–')+')<br><small>'+w.ex+'</small></li>').join('')+'</ul>':'';show('end')}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.cat');if(b)start(b.dataset.id)});
$('#go').addEventListener('click',()=>checked?next():check());
$('#ans').addEventListener('input',()=>$('#err').textContent='');
$('#ans').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#go').click()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&checked&&e.target.id!=='go'&&!$('#play').hidden)$('#go').click()});
$('#hlp').addEventListener('click',e=>{const b=e.target.closest('button'),a=$('#ans');if(!b||a.disabled)return;const s=a.selectionStart==null?a.value.length:a.selectionStart,t=a.selectionEnd==null?s:a.selectionEnd;a.value=a.value.slice(0,s)+b.dataset.t+a.value.slice(t);a.focus();const p=s+b.dataset.t.length;a.setSelectionRange(p,p);$('#err').textContent=''});
$('#back').addEventListener('click',home);
$('#again').addEventListener('click',()=>start(cat.id));
$('#other').addEventListener('click',home);
tafel();home();
</script>
</body>
</html>
